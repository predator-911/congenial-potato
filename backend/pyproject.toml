[project]
name = "secure-file-storage-service-backend"
version = "0.1.0"
description = "Local secure file storage API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["large: tests requiring large local files"]
